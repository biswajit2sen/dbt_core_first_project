name: CI_NEW

on:
  workflow_dispatch:

jobs:
  dbt_ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: check python version
        run: python --version
      - name: install pip
        run: python -m pip install --upgrade pip
