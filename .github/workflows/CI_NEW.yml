name: CI_NEW

on:
  workflow_dispatch:

env:
  DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
  DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
  DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
  DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}
  DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
  DBT_SNOWFLAKE_SCHEMA: ${{ secrets.DBT_SNOWFLAKE_SCHEMA }}
  DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
  
  

jobs:
  dbt_ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: check python version
        run: python --version
      - name: Install dbt snowflake
        run: pip install dbt-snowflake
      - name: Install python deps
        run: dbt deps
      - name: converting private key
        run: |
          export PRIVATE_KEY=$(python3 -c "import os; print(os.environ['RAW_PRIVATE_KEY'].replace('\\n', '\n').strip())")
      - name: Run dbt test
        run: dbt test --profiles-dir ./
      - name: dbt run
        run: dbt run --profiles-dir ./
